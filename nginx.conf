server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache aset statis (CSS/JS) supaya kunjungan berikutnya lebih cepat
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
